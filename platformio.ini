; PlatformIO Project Configuration File
;
; Display/touch stack: TFT_eSPI + XPT2046_Touchscreen, matching the
; proven-working witnessmenow/ESP32-Cheap-Yellow-Display reference
; (Examples/Basics/1-HelloWorld, 2-TouchTest) for this exact board.
; LVGL wired in via our own flush_cb in src/main.cpp.

[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    lvgl/lvgl@9.5.0
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D USER_SETUP_LOADED
    -D USE_HSPI_PORT
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF

; This board (USB-C, "TPM408-2.8") carries an ST7789, not an ILI9341 clone:
; see HARDWARE_NOTES.md "Correction: the controller is an ST7789". The old
; ILI9341_2_DRIVER + TFT_INVERSION_ON combination filled the panel but wrote
; the wrong gamma tables (dark colours turn blue).
[env:cyd]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
